<form (ngSubmit)="login()" class="login-form">
  <h2>Login</h2>
  <div class="form-group">
    <input [(ngModel)]="username" name="username" placeholder="Username" required class="form-control">
  </div>
  <div class="form-group">
    <input [(ngModel)]="password" name="password" type="password" placeholder="Password" required class="form-control">
  </div>
  <button type="submit" class="btn btn-primary">Login</button>
  <div *ngIf="error" class="error-message">{{ error }}</div>
</form>
